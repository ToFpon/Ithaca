<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Icône de la barre système : en couleur (une icône symbolique serait recolorée d'une seule teinte
       par GNOME), lisible à 16 px : disque violet, centre clair, triangle « lecture » violet → rose. -->
  <defs>
    <linearGradient id="ring" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ddd6fe"/>
      <stop offset="1" stop-color="#faf5ff"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
  </defs>
  <circle cx="24" cy="24" r="22.5" fill="url(#ring)"/>
  <circle cx="24" cy="24" r="17" fill="url(#disc)"/>
  <path d="M19.5 15.5 L34 24 L19.5 32.5 Z" fill="url(#play)" stroke="url(#play)" stroke-width="3.5"
        stroke-linejoin="round"/>
</svg>
